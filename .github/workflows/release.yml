name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG pkg=$PKG"
          test "$TAG" = "$PKG" || { echo "Tag $TAG != package $PKG"; exit 1; }

      - name: Lint, type-check, test
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest build
          pip install -e . --no-deps
          ruff check src tests
          mypy src
          pytest -q

      - name: Build sdist + wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Publish to MCP Registry
        if: ${{ vars.PUBLISH_TO_MCP_REGISTRY == 'true' }}
        run: |
          # PyPI can take a moment to index a fresh release; wait for it.
          VER="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/mcp-laya/${VER}/json")
            [ "$code" = "200" ] && break
            echo "waiting for PyPI to index ${VER} ($code)…"; sleep 15
          done
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m); case "$ARCH" in x86_64) ARCH=amd64;; aarch64) ARCH=arm64;; esac
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz" | tar -xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
